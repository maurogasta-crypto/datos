<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Roli, el robot</title>
<link rel="stylesheet" href="estilos.css?v=estilos-14">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="./icono-192.png">
<style>
  .ro-niveles { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0; }
  .ro-niveles button { flex: 1 1 5.5rem; min-height: 48px; font-size: .85rem; }
  .ro-niveles button[aria-pressed="true"] { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  .ro-act { background: var(--tinta2); border: 1px solid var(--linea); border-radius: var(--r); margin: .6rem 0; }
  .ro-act > summary { list-style: none; cursor: pointer; padding: .8rem; display: flex; gap: .6rem; align-items: center; min-height: 56px; }
  .ro-act > summary::-webkit-details-marker { display: none; }
  .ro-act .ic { font-size: 1.6rem; }
  .ro-act .n { flex: 1; font-weight: 600; font-size: 1.05rem; }
  .ro-act .n small { display: block; font-weight: 400; color: var(--gris); font-size: .8rem; }
  .ro-act .cta { font-family: var(--mono); font-size: .8rem; color: var(--gris); }
  .ro-act .cta.ok { color: var(--ok); }
  .ro-cuerpo { padding: 0 .8rem .8rem; }
  .ro-cosas { color: var(--gris); font-size: .86rem; margin: 0 0 .4rem; padding-left: 1.1rem; }
  .ro-aviso { font-size: .84rem; color: var(--ojo); border: 1px solid var(--ojo); border-radius: var(--r); padding: .4rem .6rem; margin: .4rem 0; }
  .ro-paso { display: flex; gap: .6rem; padding: .7rem 0; border-top: 1px solid var(--linea); }
  .ro-paso input { width: 28px; height: 28px; flex: none; accent-color: var(--ok); margin-top: .1rem; }
  .ro-paso .t { flex: 1; }
  .ro-paso.hecho .t > b { color: var(--gris); text-decoration: line-through; }
  .ro-paso code { display: inline-block; background: var(--tinta3); border: 1px solid var(--linea); border-radius: 6px; padding: .15rem .45rem; margin: .15rem .2rem .15rem 0; font-family: var(--mono); font-size: .95rem; color: var(--acento); }
  .ro-ve { color: var(--ok); font-size: .88rem; margin: .2rem 0 0; }
  .ro-des { margin-top: .6rem; padding: .6rem; border: 1px dashed var(--acento); border-radius: var(--r); font-size: .92rem; }
  .ro-tabs { display: flex; gap: .4rem; margin: .4rem 0; }
  .ro-tabs button { flex: 1; min-height: 48px; }
  .ro-tabs button[aria-pressed="true"] { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  .ro-comp { padding: .6rem 0; border-top: 1px solid var(--linea); }
  .ro-comp .t { display: flex; gap: .5rem; align-items: baseline; }
  .ro-comp .t b { flex: 1; font-weight: 500; }
  .ro-comp .usd { font-family: var(--mono); white-space: nowrap; font-size: .85rem; }
  .ro-comp .para { color: var(--gris); font-size: .88rem; margin: .2rem 0; }
  .ro-comp .ojo { color: var(--ojo); font-size: .84rem; margin: .2rem 0; }
  .ro-tres { display: flex; gap: .3rem; margin-top: .3rem; }
  .ro-tres button { flex: 1; min-height: 44px; font-size: .85rem; }
  .ro-tres button.on { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  .ro-grupo { font-weight: 600; margin: 1rem 0 .2rem; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="hoja.css?v=hoja-2">
</head>
<body>
<!--
  roli.html — las actividades de Roli y lo que conviene comprarle. Sello: roli-1

  Mauro, 10-nov-2026. Esta página sólo DIBUJA: las actividades, las palabras
  y las compras viven en `roli.js`, que se prueba sin navegador (`node
  pruebas/roli.mjs`). Sin Firebase y sin cuenta, a propósito: la abren los
  chicos desde la laptop del robot. Lo que se tilda se recuerda en ESTE
  navegador (localStorage), no en el panel.
  Se llega desde la ficha de Roli (`sitio.guias` de `proyectos/roli`).
-->
<div id="barra">
  <div class="marca"><a href="./" class="volver" style="text-decoration:none">← Panel</a> · Roli<small id="sello"></small></div>
</div>
<main style="padding:.6rem .8rem 4rem;max-width:44rem;margin:0 auto">
  <div class="ro-tabs" role="tablist">
    <button class="btn" id="tAct" aria-pressed="true">🤖 Actividades</button>
    <button class="btn" id="tCom" aria-pressed="false">🛒 Para comprar</button>
  </div>
  <section id="vAct">
    <p class="gris" style="margin:.2rem 0">Elegí un nivel y seguí los pasos. Lo que escribís va en la consola de la laptop, una línea por vez.</p>
    <div class="ro-niveles" id="niveles"></div>
    <div id="acts"></div>
  </section>
  <section id="vCom" hidden>
    <p class="gris" style="margin:.2rem 0">Lo que recomendamos sumarle a Roli. Los precios son aproximados, en dólares, y se confirman al comprar. Lo que marcás se recuerda en este navegador.</p>
    <div id="total" class="tarj"></div>
    <div id="compras"></div>
  </section>
</main>
<script type="module">
import * as R from "./roli.js";
const $ = (id) => document.getElementById(id);
$("sello").textContent = " · " + R.VERSION;
const guardado = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let hechos = guardado("roli_hechos", {}), compras = guardado("roli_compras", {}), nivel = guardado("roli_nivel", 1);
const abiertas = new Set();

function pintarActs() {
  $("niveles").innerHTML = R.NIVELES.map((n) =>
    '<button class="btn" data-n="' + n.n + '" aria-pressed="' + (n.n === nivel) + '">' + n.ic + " " + n.n + "<br><small>" + R.esc(n.t) + "</small></button>").join("");
  $("acts").innerHTML = R.ACTIVIDADES.filter((a) => a.nivel === nivel).map((a) => {
    const hs = a.pasos.filter((_, i) => hechos[a.id + ":" + i]).length;
    let h = '<details class="ro-act" data-a="' + a.id + '"' + (abiertas.has(a.id) ? " open" : "") + '><summary><span class="ic">' + a.ic + '</span><span class="n">' + R.esc(a.titulo)
      + "<small>" + R.esc(a.meta) + '</small></span><span class="cta' + (hs === a.pasos.length ? " ok" : "") + '">' + hs + "/" + a.pasos.length + "</span></summary><div class=\"ro-cuerpo\">";
    if (a.ojos) h += '<p class="ro-aviso">' + R.esc(R.AVISO_OJOS) + "</p>";
    h += '<ul class="ro-cosas">' + a.cosas.map((c) => "<li>" + R.esc(c) + "</li>").join("") + "</ul>";
    a.pasos.forEach((p, i) => {
      const ok = hechos[a.id + ":" + i];
      h += '<div class="ro-paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-p="' + a.id + ":" + i + '"' + (ok ? " checked" : "") + ' aria-label="Hecho">'
        + '<div class="t"><b>' + (i + 1) + ". " + R.esc(p.t) + "</b><br>" + (p.escribi || []).map((c) => "<code>" + R.esc(c) + "</code>").join("")
        + (p.ve ? '<p class="ro-ve">👉 ' + R.esc(p.ve) + "</p>" : "") + "</div></div>";
    });
    return h + '<div class="ro-des">🏆 <b>Desafío:</b> ' + R.esc(a.desafio) + "</div></div></details>";
  }).join("");
}

function pintarCompras() {
  const t = R.totalCompras(R.COMPRAS, compras);
  $("total").innerHTML = "Falta comprar: <b>USD " + t.min + "–" + t.max + "</b> (aproximado)";
  $("compras").innerHTML = R.porPrioridad().map((g) => '<div class="ro-grupo">' + R.esc(R.PRIORIDAD_TEXTO[g.p]) + "</div>" + g.items.map((c) => {
    const e = compras[c.id] || "falta";
    const b = (v, n) => '<button class="btn' + (e === v ? " on" : "") + '" data-c="' + c.id + '" data-v="' + v + '">' + n + "</button>";
    return '<div class="ro-comp"><div class="t"><b>' + R.esc(c.n) + (c.opcional ? " (opcional)" : "") + '</b><span class="usd">' + R.usd(c.usd) + "</span></div>"
      + '<div class="para">' + R.esc(c.para) + "</div>" + (c.ojo ? '<div class="ojo">⚠ ' + R.esc(c.ojo) + "</div>" : "")
      + (c.pendiente ? '<div class="para">Pendiente en el panel: <code>' + c.pendiente + "</code></div>" : "")
      + '<div class="ro-tres">' + b("falta", "Falta") + b("pedido", "Pedido") + b("llego", "Llegó ✓") + "</div></div>";
  }).join("")).join("");
}

function ver(v) {
  $("vAct").hidden = v !== "act"; $("vCom").hidden = v !== "com";
  $("tAct").setAttribute("aria-pressed", v === "act"); $("tCom").setAttribute("aria-pressed", v === "com");
  if (v === "com") pintarCompras(); else pintarActs();
}
$("tAct").onclick = () => { history.replaceState(null, "", "#"); ver("act"); };
$("tCom").onclick = () => { history.replaceState(null, "", "#comprar"); ver("com"); };
$("niveles").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-n]"); if (!b) return; nivel = +b.dataset.n; guardar("roli_nivel", nivel); pintarActs(); });
$("acts").addEventListener("toggle", (ev) => { const d = ev.target; if (!d.dataset || !d.dataset.a) return; if (d.open) abiertas.add(d.dataset.a); else abiertas.delete(d.dataset.a); }, true);
$("acts").addEventListener("change", (ev) => { const t = ev.target; if (!t.dataset.p) return; if (t.checked) hechos[t.dataset.p] = 1; else delete hechos[t.dataset.p]; guardar("roli_hechos", hechos); pintarActs(); });
$("compras").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-c]"); if (!b) return; if (b.dataset.v === "falta") delete compras[b.dataset.c]; else compras[b.dataset.c] = b.dataset.v; guardar("roli_compras", compras); pintarCompras(); });
ver(location.hash === "#comprar" ? "com" : "act");
</script>
</body>
</html>
