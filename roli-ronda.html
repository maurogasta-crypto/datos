<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Roli · A jugar</title>
<link rel="stylesheet" href="estilos.css?v=estilos-14">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="./icono-192.png">
<style>
  :root { --rr-a: #ffd23f; --rr-b: #3ddc97; --rr-c: #4cc9f0; --rr-d: #ff6b9d; }
  html, body { background: #0f1216; }
  body { margin: 0; color: #f3f5f7; font-family: "Source Sans 3", system-ui, sans-serif; overflow-x: hidden; }
  /* Las fotos de Roli, de fondo, desvanecidas y con un movimiento lento. */
  .fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .fondo i { position: absolute; background-size: cover; background-position: center; opacity: 0; will-change: transform, opacity; }
  .fondo .f1 { inset: -6% -4% -6% 28%; background-image: url(roli-foto-frente.jpg);
    -webkit-mask-image: linear-gradient(to left, #000 25%, transparent 92%); mask-image: linear-gradient(to left, #000 25%, transparent 92%);
    animation: ver1 28s ease-in-out infinite; }
  .fondo .f2 { inset: -4% 30% -4% -6%; background-image: url(roli-foto-arriba.jpg);
    -webkit-mask-image: linear-gradient(to right, #000 20%, transparent 90%); mask-image: linear-gradient(to right, #000 20%, transparent 90%);
    animation: ver2 28s ease-in-out infinite; }
  @keyframes ver1 { 0% { opacity: 0; transform: scale(1.04) translateX(1%); } 8% { opacity: .30; } 42% { opacity: .30; transform: scale(1.12) translateX(-1%); } 50%, 100% { opacity: 0; transform: scale(1.12); } }
  @keyframes ver2 { 0%, 50% { opacity: 0; transform: scale(1.04); } 58% { opacity: .30; } 92% { opacity: .30; transform: scale(1.12) translateX(1%); } 100% { opacity: 0; transform: scale(1.12); } }
  .fondo::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 50% at 12% 0%, rgba(76,201,240,.22), transparent 70%), radial-gradient(50% 45% at 100% 100%, rgba(255,107,157,.18), transparent 70%), radial-gradient(40% 40% at 90% 10%, rgba(255,210,63,.16), transparent 70%); }
  .fondo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,18,22,.35), rgba(15,18,22,.78)); }
  @media (prefers-reduced-motion: reduce) { .fondo i { animation: none; } .fondo .f1 { opacity: .28; } }

  .app { position: relative; z-index: 1; max-width: 62rem; margin: 0 auto; padding: .6rem 1rem 5rem; }
  .arriba { display: flex; align-items: center; gap: .8rem; padding: .4rem 0; }
  .arriba a { color: #c9d1d9; text-decoration: none; font-size: .9rem; }
  .arriba .sello { margin-left: auto; font: .75rem var(--mono, monospace); color: #8b95a1; }
  .logo { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1;
    background: linear-gradient(90deg, var(--rr-a), var(--rr-d) 55%, var(--rr-c)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lema { color: #c9d1d9; margin: .2rem 0 .8rem; font-size: 1.05rem; }

  /* Las tres fases, arriba, siempre a la vista */
  .fases { display: flex; gap: .5rem; margin: .6rem 0 1rem; }
  .fases button { flex: 1; min-height: 60px; border-radius: 16px; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    color: #e8edf2; font-size: 1.05rem; font-weight: 700; backdrop-filter: blur(6px); cursor: pointer; transition: transform .15s, background .2s; }
  .fases button small { display: block; font-weight: 500; font-size: .72rem; color: #a9b4bf; }
  .fases button[aria-pressed="true"] { background: linear-gradient(135deg, var(--rr-a), #ffb703); color: #1b1d21; border-color: transparent; transform: translateY(-2px); }
  .fases button[aria-pressed="true"] small { color: #3a3412; }
  .fases button.listo::after { content: " ✓"; color: var(--rr-b); }
  .fases button[aria-pressed="true"].listo::after { color: #1b6b43; }

  .panel { background: rgba(20,24,30,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; padding: 1rem 1.1rem; margin: .8rem 0; backdrop-filter: blur(8px); animation: entra .35s ease both; }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .panel h2 { margin: 0 0 .2rem; font-size: 1.5rem; }
  .gris { color: #a9b4bf; }
  .adulto { display: inline-block; font-size: .78rem; font-weight: 700; background: rgba(76,201,240,.18); color: var(--rr-c); border: 1px solid rgba(76,201,240,.4); border-radius: 999px; padding: .1rem .7rem; }

  .pista { margin: .9rem 0; border-left: 5px solid var(--c, var(--rr-c)); padding-left: .8rem; }
  .pista h3 { margin: 0; font-size: 1.2rem; }
  .pista .q { color: #a9b4bf; font-size: .85rem; margin: 0 0 .3rem; }
  .paso { display: flex; gap: .8rem; align-items: flex-start; padding: .65rem .2rem; border-top: 1px solid rgba(255,255,255,.08); }
  .paso input[type=checkbox] { width: 34px; height: 34px; flex: none; accent-color: var(--rr-b); margin-top: .1rem; }
  .paso .t { flex: 1; font-size: 1.08rem; }
  .paso.hecho .t > b { color: #7d8793; text-decoration: line-through; }
  .paso code, .cmd { display: inline-block; background: #0b0e12; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: .2rem .6rem; margin: .25rem .3rem .1rem 0;
    font-family: var(--mono, ui-monospace, monospace); font-size: 1.05rem; color: var(--rr-a); }
  .paso .nota { color: #a9b4bf; font-size: .92rem; margin: .2rem 0 0; }
  .paso .ve { color: var(--rr-b); font-size: .95rem; margin: .2rem 0 0; }
  .avance { height: 10px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin: .4rem 0 0; }
  .avance i { display: block; height: 100%; background: linear-gradient(90deg, var(--rr-b), var(--rr-c)); border-radius: 999px; transition: width .4s; }

  .btn-grande { min-height: 60px; padding: 0 1.4rem; border-radius: 16px; border: 0; font-size: 1.15rem; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, var(--rr-b), var(--rr-c)); color: #0b1a14; margin: .4rem .4rem 0 0; }
  .btn-grande.sec { background: rgba(255,255,255,.1); color: #e8edf2; border: 1px solid rgba(255,255,255,.2); }
  .btn-grande:disabled { opacity: .4; }

  /* El selector de juegos: tarjetas grandes, de a una por dedo */
  .juegos { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .8rem; margin-top: .6rem; }
  .juego { text-align: left; border-radius: 20px; padding: 1rem; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #f3f5f7; cursor: pointer;
    transition: transform .15s, border-color .2s, background .2s; min-height: 150px; font: inherit; }
  .juego:hover, .juego:focus-visible { transform: translateY(-3px); border-color: var(--rr-a); }
  .juego[aria-pressed="true"] { border-color: var(--rr-a); background: rgba(255,210,63,.14); }
  .juego .ic { font-size: 2.6rem; display: block; }
  .juego b { font-size: 1.15rem; display: block; margin: .2rem 0; }
  .juego span.m { color: #c9d1d9; font-size: .9rem; display: block; }
  .juego .tag { display: inline-block; margin-top: .5rem; font-size: .75rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: .1rem .6rem; color: #d7dde4; }
  .hoy { background: var(--rr-a) !important; color: #1b1d21 !important; font-weight: 800; }

  /* El tablero */
  .rondas { display: flex; gap: .4rem; margin: .4rem 0 .8rem; overflow-x: auto; }
  .rondas button { flex: 1 0 8rem; min-height: 56px; border-radius: 14px; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #e8edf2; font-weight: 700; font-size: .95rem; cursor: pointer; }
  .rondas button[aria-pressed="true"] { border-color: var(--rr-d); background: rgba(255,107,157,.2); }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .7rem; margin: .6rem 0; }
  .rol { border-radius: 18px; padding: .8rem .9rem; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
  .rol .ic { font-size: 1.9rem; }
  .rol .quien { display: block; font-size: 1.5rem; font-weight: 800; color: var(--rr-a); }
  .rol .nom { font-weight: 700; }
  .rol .hace { color: #b9c3cd; font-size: .92rem; margin-top: .15rem; }
  .rol.ayuda { opacity: .85; }
  .estrellas { font-size: 2.2rem; letter-spacing: .2rem; }
  .fila { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin: .5rem 0; }
  .fila label { display: flex; gap: .5rem; align-items: center; font-size: 1.05rem; }
  .fila input[type=number] { width: 5rem; min-height: 52px; font-size: 1.2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: #0b0e12; color: #fff; padding: 0 .6rem; }
  .fila input[type=checkbox] { width: 32px; height: 32px; accent-color: var(--rr-b); }
  .equipo input[type=text] { min-height: 52px; font-size: 1.1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: #0b0e12; color: #fff; padding: 0 .8rem; width: 100%; box-sizing: border-box; }
  .equipo .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .5rem; }
  .festejo { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--rr-a); }
  .nivel-pide { display: inline-block; background: rgba(255,210,63,.18); border: 1px solid var(--rr-a); color: var(--rr-a); border-radius: 12px; padding: .2rem .8rem; font-weight: 800; margin: .3rem 0; }
  ul.cosas { color: #c9d1d9; padding-left: 1.2rem; margin: .3rem 0; }
  a.enlace { color: var(--rr-c); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
</head>
<body>
<!--
  roli-ronda.html — «A jugar con Roli»: la pantalla de la TABLET al costado durante una ronda de juego.
  Sello: roli-js-6

  Mauro, 14-nov-2026: «un adulto instala las últimas versiones asistiendo a los niños en el robot y en la
  laptop… la presentación con el selector de juegos… uno opera la tablet y lee, otro opera la laptop y le carga
  las órdenes al robot, otro prepara el terreno, y se van rotando». Tres fases: 1 PREPARAR (la guía simplificada
  del adulto: laptop, Arduino, consola, calibración), 2 ELEGIR el juego y poner los nombres, 3 ¡A JUGAR! (el
  tablero: una ronda por vez, con quién hace qué, los pasos y las estrellas).

  Esta página sólo DIBUJA: la preparación, los juegos, los roles y las cuentas viven en `roli.js` (se prueban con
  `node pruebas/roli.mjs`). Sin Firebase, sin cuenta. El equipo, los juegos y las estrellas se recuerdan en ESTE
  navegador con las MISMAS claves que «Jugar hoy» de roli.html, así que lo hecho acá se ve allá (y las medidas
  se copian allá). Los fondos son fotos de Roli desvanecidas, solo decoración.
-->
<div class="fondo" aria-hidden="true"><i class="f1"></i><i class="f2"></i></div>
<main class="app">
  <div class="arriba"><a href="roli.html">← Roli</a><span class="sello" id="sello"></span></div>
  <h1 class="logo">¡A jugar con Roli!</h1>
  <p class="lema" id="lema">Primero lo prepara un adulto, después juegan por turnos.</p>
  <nav class="fases" id="fases" aria-label="Pasos de la ronda"></nav>
  <section id="v"></section>
</main>
<script type="module">
import * as R from "./roli.js";
const $ = (id) => document.getElementById(id);
$("sello").textContent = R.VERSION;
const guardado = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const HOY = new Date().toISOString().slice(0, 10);
let fase = guardado("roli_ronda_fase", 1);
let din = R.DINAMICAS.find((d) => d.id === guardado("roli_juego_elegido", "")) || R.dinamicaDe(HOY);
let jugadores = guardado("roli_equipo", ["Persona 1", "Persona 2", "Persona 3"]);
let prep = guardado("roli_ronda_prep", {});           // lo que el adulto ya hizo de la preparación
let rondaAct = guardado("roli_ronda_n", 0);
const cargarJuego = () => guardado("roli_juego3_" + din.id, null) || { est: {}, medidas: {}, hechos: {} };
let juego = cargarJuego();
const guardarJuego = () => guardar("roli_juego3_" + din.id, juego);
const estrellas = (n) => "⭐".repeat(n) + "☆".repeat(Math.max(0, 3 - n));
const COLORES = ["var(--rr-c)", "var(--rr-b)", "var(--rr-d)", "var(--rr-a)"];

const pistas = () => R.preparacionDe(din);
const pasosPrep = () => pistas().flatMap((g) => g.pasos.map((_, i) => g.id + ":" + i));
const prepHecha = () => { const t = pasosPrep(); return t.length > 0 && t.every((k) => prep[k]); };

function pintarFases() {
  const f = [["1", "Preparar", "el adulto con los chicos"], ["2", "Elegir", "el juego y el equipo"], ["3", "¡A jugar!", "ronda por ronda"]];
  $("fases").innerHTML = f.map((x, i) => '<button data-f="' + (i + 1) + '" aria-pressed="' + (fase === i + 1) + '"' + ((i === 0 && prepHecha()) ? ' class="listo"' : "") + ">" + x[0] + ". " + x[1] + "<small>" + x[2] + "</small></button>").join("");
}

function vPreparar() {
  const gs = pistas(), total = pasosPrep().length, hechos = pasosPrep().filter((k) => prep[k]).length;
  let h = '<div class="panel"><span class="adulto">👩‍🔧 Para el adulto</span><h2>Dejar a Roli listo</h2>'
    + '<p class="gris" style="margin:.2rem 0">Se hace una vez al empezar la partida, con los chicos al lado mirando y ayudando. Tildá cada paso cuando esté.</p>'
    + '<p>El juego elegido pide <span class="nivel-pide">nivel ' + R.nivelDeJuego(din) + "</span> en el programa (" + din.ic + " " + R.esc(din.titulo) + ").</p>"
    + '<div class="avance"><i style="width:' + (total ? Math.round(100 * hechos / total) : 0) + '%"></i></div><p class="gris" style="margin:.2rem 0">' + hechos + " de " + total + " pasos</p></div>";
  gs.forEach((g, gi) => {
    h += '<div class="panel pista" style="--c:' + COLORES[gi % 4] + '"><h3>' + g.ic + " " + R.esc(g.titulo) + '</h3><p class="q">' + R.esc(g.quien) + "</p>";
    g.pasos.forEach((p, i) => {
      const k = g.id + ":" + i, ok = prep[k];
      h += '<div class="paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-p="' + k + '"' + (ok ? " checked" : "") + ' aria-label="Hecho"><div class="t"><b>' + R.esc(p.t) + "</b><br>"
        + (p.escribi || []).map((c) => "<code>" + R.esc(c) + "</code>").join("")
        + (p.nota ? '<p class="nota">' + R.esc(p.nota) + "</p>" : "") + (p.ve ? '<p class="ve">👉 ' + R.esc(p.ve) + "</p>" : "") + "</div></div>";
    });
    h += "</div>";
  });
  h += '<div class="panel"><p style="margin:0 0 .3rem">Los chicos ya pueden mirar el robot mientras tanto: ' + (din.cosas.length ? "para el juego hace falta:" : "") + '</p><ul class="cosas">' + din.cosas.map((c) => "<li>" + R.esc(c) + "</li>").join("") + "</ul>"
    + '<button class="btn-grande" id="irElegir"' + (prepHecha() ? "" : " disabled") + '>Listo, ¡a elegir el juego! →</button>'
    + '<button class="btn-grande sec" id="irElegirYa">Saltear: ya está preparado</button>'
    + '<button class="btn-grande sec" id="prepReset">↺ Destildar todo (otra partida)</button></div>';
  $("v").innerHTML = h;
}

function vElegir() {
  let h = '<div class="panel"><h2>¿A qué jugamos?</h2><p class="gris" style="margin:.2rem 0">Toquen un juego. Todos son en equipo: nadie compite, juntos suman ⭐.</p><div class="juegos">'
    + R.DINAMICAS.map((d) => '<button class="juego" data-g="' + R.esc(d.id) + '" aria-pressed="' + (d.id === din.id) + '"><span class="ic">' + d.ic + "</span><b>" + R.esc(d.titulo) + "</b><span class=\"m\">" + R.esc(d.meta) + '</span><span class="tag' + (d.fecha === HOY ? " hoy" : "") + '">'
      + (d.fecha === HOY ? "HOY · " : "") + d.minutos + " min · nivel " + R.nivelDeJuego(d) + "</span></button>").join("") + "</div></div>";
  h += '<div class="panel equipo"><h2>👥 El equipo</h2><p class="gris" style="margin:.2rem 0">Escriban los nombres. En cada ronda la página dice quién hace cada lugar y los lugares <b>rotan</b>.</p><div class="grid">'
    + jugadores.map((j, i) => '<input type="text" maxlength="20" data-nom="' + i + '" value="' + R.esc(j) + '" aria-label="Nombre ' + (i + 1) + '">').join("") + "</div>"
    + '<div class="fila"><button class="btn-grande sec" id="mas">＋ Sumar a alguien</button><button class="btn-grande sec" id="menos"' + (jugadores.length <= 2 ? " hidden" : "") + '>− Quitar al último</button></div></div>'
    + '<div class="panel"><h2>' + din.ic + " " + R.esc(din.titulo) + "</h2><p>" + R.esc(din.como) + '</p><button class="btn-grande" id="jugar">¡A jugar! →</button></div>';
  $("v").innerHTML = h;
}

function vTablero() {
  if (rondaAct >= din.rondas.length || rondaAct < 0) rondaAct = 0;
  const ri = rondaAct, r = din.rondas[ri];
  const e = juego.est[r.id] || {}, est = R.estrellasPorIntentos(e.intentos, !!e.logrado);
  const reparto = R.asignarRoles(jugadores, r.roles, ri), por = {}; reparto.forEach((x) => { (por[x.rol] ||= []).push(x.persona); });
  const ayudan = jugadores.filter((j) => j.trim() && !reparto.some((x) => x.persona === j));
  const tot = R.totalEstrellas(juego.est, din.rondas);
  let h = '<div class="panel"><h2>' + din.ic + " " + R.esc(din.titulo) + '</h2><div class="rondas">'
    + din.rondas.map((x, i) => { const s = R.estrellasPorIntentos((juego.est[x.id] || {}).intentos, !!(juego.est[x.id] || {}).logrado); return '<button data-r="' + i + '" aria-pressed="' + (i === ri) + '">' + x.ic + " Ronda " + (i + 1) + (s ? "<br>" + estrellas(s) : "") + "</button>"; }).join("")
    + '</div><div class="fila"><b class="estrellas" style="font-size:1.4rem">⭐ ' + tot.total + '</b><span class="gris">meta del equipo: ' + din.metaEstrellas + "</span></div></div>";
  h += '<div class="panel"><h2>Ronda ' + (ri + 1) + " · " + R.esc(r.titulo) + '</h2><p class="gris" style="margin:.1rem 0">⏱ ' + r.minutos + " min · Nivel " + r.nivel + " · " + R.esc(r.logro) + "</p><p>" + R.esc(r.que) + "</p>";
  if (r.ojos) h += '<p class="gris">⚠ ' + R.esc(R.AVISO_OJOS) + "</p>";
  if (r.nivel >= 3 && !prepHecha()) h += '<p class="gris">¿Calibraron a Roli? Volvé a «1. Preparar» si no.</p>';
  h += '<div class="roles">' + r.roles.map((ro) => '<div class="rol"><span class="ic">' + ro.ic + '</span><span class="quien">' + R.esc((por[ro.id] || ["¿?"]).join(" y ")) + '</span><span class="nom">' + R.esc(ro.nombre) + '</span><div class="hace">' + R.esc(ro.hace) + "</div></div>").join("")
    + '<div class="rol ayuda" style="opacity:1"><span class="ic">📱</span><span class="quien">Tablet</span><span class="nom">Quien la tiene</span><div class="hace">Lee los pasos en voz alta y tilda cada uno. Se pasa de mano en cada ronda, junto con los lugares.</div></div>'
    + (ayudan.length ? '<div class="rol ayuda"><span class="ic">👀</span><span class="quien">' + R.esc(ayudan.join(" y ")) + '</span><span class="nom">Ayuda</span><div class="hace">Mira, cuenta los intentos y avisa si algo se complica. En la próxima ronda le toca otro lugar.</div></div>' : "") + "</div></div>";
  h += '<div class="panel">';
  r.pasos.forEach((p, i) => {
    const ok = juego.hechos[r.id + ":" + i];
    h += '<div class="paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-jp="' + r.id + ":" + i + '"' + (ok ? " checked" : "") + ' aria-label="Hecho"><div class="t"><b>' + (i + 1) + ". " + R.esc(p.t) + "</b><br>"
      + (p.escribi || []).map((c) => "<code>" + R.esc(c) + "</code>").join("") + (p.ve ? '<p class="ve">👉 ' + R.esc(p.ve) + "</p>" : "") + "</div></div>";
  });
  if (r.entrena) h += '<p class="nota gris">📏 <b>Entrenamiento:</b> ' + R.esc(r.entrena) + "</p>";
  h += '<div class="fila"><label>Intentos hasta lograrlo <input type="number" inputmode="numeric" min="1" max="20" data-int="' + r.id + '" value="' + R.esc(String(e.intentos ?? "")) + '"></label>'
    + '<label><input type="checkbox" data-logro="' + r.id + '"' + (e.logrado ? " checked" : "") + '> ¡Lo logramos!</label></div>'
    + (est ? '<p class="festejo"><span class="estrellas">' + estrellas(est) + "</span><br>" + R.esc(est === 3 ? "¡Al primer intento!" : est === 2 ? "¡Muy bien, en equipo!" : "¡Lo lograron! La próxima sale mejor.") + "</p>" : "")
    + '<div class="fila">' + (ri > 0 ? '<button class="btn-grande sec" id="ant">← Ronda anterior</button>' : "")
    + (ri < din.rondas.length - 1 ? '<button class="btn-grande" id="sig">¡Rotamos! Ronda ' + (ri + 2) + " →</button>" : '<button class="btn-grande" id="fin">🎉 Terminamos</button>') + "</div></div>";
  $("v").innerHTML = h;
}

function vFin() {
  const tot = R.totalEstrellas(juego.est, din.rondas);
  const cierre = R.CIERRE_RONDA.filter((c) => (c.desde || 1) <= R.nivelDeJuego(din));
  $("v").innerHTML = '<div class="panel"><h2>🎉 ¡Terminaron!</h2><p class="festejo"><span class="estrellas">⭐ ' + tot.total + "</span><br>" + R.esc(R.mensajeDeEquipo(tot.total, tot.max, din.metaEstrellas)) + "</p></div>"
    + '<div class="panel"><h2>Para cerrar</h2>' + cierre.map((c) => '<div class="paso"><div class="t"><b>' + R.esc(c.t) + "</b><br>" + (c.escribi || []).map((x) => "<code>" + R.esc(x) + "</code>").join("") + "</div></div>").join("")
    + '<ul class="cosas">' + din.cierre.map((c) => "<li>" + R.esc(c) + "</li>").join("") + '</ul><p><a class="enlace" href="roli.html#jugar">📏 Cargar y copiar las medidas de hoy →</a></p>'
    + '<button class="btn-grande" id="otra">Otra ronda de juego →</button><button class="btn-grande sec" id="volver">← Volver al tablero</button></div>';
}

let terminado = false;
function pintar(arriba) {
  pintarFases();
  $("lema").textContent = fase === 1 ? "Primero lo prepara un adulto, y los chicos miran y ayudan." : fase === 2 ? "Elijan el juego y pongan los nombres." : "Uno lee acá, otro escribe en la laptop, otro prepara el terreno… ¡y se rotan!";
  if (fase === 1) vPreparar(); else if (fase === 2) vElegir(); else if (terminado) vFin(); else vTablero();
  if (arriba) window.scrollTo({ top: 0 });   // sólo al cambiar de fase o de ronda: tildar un paso no te manda arriba
}
const irA = (f) => { fase = f; terminado = false; guardar("roli_ronda_fase", f); pintar(true); };

$("fases").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-f]"); if (b) irA(+b.dataset.f); });
$("v").addEventListener("change", (ev) => {
  const t = ev.target, d = t.dataset;
  if (d.p) { if (t.checked) prep[d.p] = 1; else delete prep[d.p]; guardar("roli_ronda_prep", prep); }
  else if (d.jp) { if (t.checked) juego.hechos[d.jp] = 1; else delete juego.hechos[d.jp]; guardarJuego(); }
  else if (d.int != null) { (juego.est[d.int] ||= {}).intentos = t.value === "" ? "" : Math.max(1, Math.min(20, +t.value)); if (t.value !== "") juego.est[d.int].logrado = true; guardarJuego(); }
  else if (d.logro != null) { (juego.est[d.logro] ||= {}).logrado = t.checked; guardarJuego(); }
  else if (d.nom != null) { const n = t.value.trim(); if (n && !jugadores.includes(n)) { jugadores[+d.nom] = n; guardar("roli_equipo", jugadores); } return; }
  pintar();
});
$("v").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.g) { const d = R.DINAMICAS.find((x) => x.id === b.dataset.g); if (d) { din = d; guardar("roli_juego_elegido", d.id); juego = cargarJuego(); rondaAct = 0; guardar("roli_ronda_n", 0); pintar(); } return; }
  if (b.dataset.r != null) { rondaAct = +b.dataset.r; guardar("roli_ronda_n", rondaAct); pintar(true); return; }
  const id = b.id;
  if (id === "irElegir" || id === "irElegirYa") irA(2);
  else if (id === "prepReset") { prep = {}; guardar("roli_ronda_prep", prep); pintar(); }
  else if (id === "mas" && jugadores.length < 6) { jugadores.push("Persona " + (jugadores.length + 1)); guardar("roli_equipo", jugadores); pintar(); }
  else if (id === "menos" && jugadores.length > 2) { jugadores.pop(); guardar("roli_equipo", jugadores); pintar(); }
  else if (id === "jugar") irA(3);
  else if (id === "sig") { rondaAct++; guardar("roli_ronda_n", rondaAct); pintar(true); }
  else if (id === "ant") { rondaAct--; guardar("roli_ronda_n", rondaAct); pintar(true); }
  else if (id === "fin") { terminado = true; pintar(true); }
  else if (id === "volver") { terminado = false; pintar(true); }
  else if (id === "otra") { prep = {}; guardar("roli_ronda_prep", prep); rondaAct = 0; guardar("roli_ronda_n", 0); irA(1); }
});
pintar();
</script>
</body>
</html>
