<style>
  .ob-cab h1 { margin: .2rem 0 0; }
  .ob-dir { color: var(--gris); margin: 0 0 .6rem; }
  .ob-obras { display: flex; gap: .4rem; flex-wrap: wrap; margin: .4rem 0 .8rem; }
  .ob-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .5rem; margin: .8rem 0; }
  .ob-tile { background: var(--tinta2); border: 1px solid var(--linea); border-radius: var(--r); padding: .7rem .4rem;
    text-align: center; color: var(--texto); font: inherit; cursor: pointer; min-height: 84px; }
  .ob-tile b { display: block; font-size: 1.6rem; line-height: 1.2; }
  .ob-tile span { display: block; font-size: .8rem; }
  .ob-tile small { color: var(--gris); font-family: var(--mono); font-size: .72rem; }
  .ob-tile.on { border-color: var(--acento); background: var(--tinta3); }
  .ob-plata { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: .2rem .6rem; font-size: .9rem; align-items: baseline; }
  .ob-plata .n { text-align: right; font-family: var(--mono); }
  .ob-ok { color: var(--ok); } .ob-mal { color: var(--mal); }

  .ob-item img { max-width: 100%; max-height: 240px; border-radius: var(--r-s); display: block; margin: .3rem 0; }
  .ob-meta { font-size: .78rem; color: var(--gris); }
  .ob-resumen { display: grid; grid-template-columns: 1fr auto; gap: .15rem .6rem; font-size: .88rem; margin: .2rem 0 .4rem; }

<body>
<!--
  ════════════════════════════════════════════════════════════════
  obra.html — Los PROYECTOS: un lugar por inmueble. Sello: obra-5

  Desde obra-5 (15-oct-2026) un INVITADO entra a ver los proyectos que
  Mauro le marcó en «Puerta» (`personas/{uid}.proyectos`). Sólo VE: la regla
  v6 le deja leer `proyectos/<id>` de los suyos y nada más, así que la página
  no le muestra ningún botón que escriba (`body.solo-ver`). Y no puede listar
  `proyectos` por `clase`: la base no podría probar que no hay uno ajeno, así
  que se le leen uno por uno, por id.

  Desde obra-4 (15-oct-2026) un gasto se carga con la FOTO DE LA FACTURA,
  como en el resto del ecosistema (Mauro): «📷 Gasto con foto» abre la ficha
  con la foto primero, la IA (`P.leerFactura`, nucleo-9) completa lo vacío
  —título, monto, moneda, fecha, rubro, detalle— y trae RUT, número, medio y
  renglones al campo `factura`. La persona revisa y guarda; la imagen se
  sube al guardar. La moneda, la fecha y el rubro del formulario son valores
  POR DEFECTO: lo que lee la factura les gana (la lección de plata-15).

  Desde obra-3 (15-oct-2026) un inmueble se mira en DOS niveles (Mauro:
  «antes de esa visualización tiene que haber una visión en diferentes
  alquileres, uno de ellos el gimnasio… y después una lista de detalles
  generales de todo el local… van a aparecer otros proyectos con todo lo
  charlado con cada arrendatario»). Arriba, los ALQUILERES del local
  (`obra.unidades.<id>`: nombre, arrendatario, estado), cada uno una tarjeta
  que abre su propia ficha (`?o=<obra>&u=<unidad>`); abajo, lo general del
  local. Una cosa o un dato es de un alquiler si lleva `unidad`; sin ella es
  del local. La plata de arriba suma TODO el local, alquileres incluidos.

  Desde obra-2 (15-oct-2026) en pantalla se llaman PROYECTOS, no obras
  (Mauro: «en el panel llamemos le proyectos»). Por dentro sigue siendo
  `clase: "obra"` y el campo `obra`: cambiar el dato no le agrega nada a
  quien mira y obligaría a mudar lo guardado y el respaldo. Y las secciones
  son las que él pidió ese día: trabajos realizados, presupuestos, saldos
  pendientes (con su RUBRO: materiales, jornales…) y alquiler (contrato,
  acuerdos y los datos del arrendamiento; desde obra-3 viven en la ficha de
  cada alquiler, con `unidad`). Un presupuesto es una REFERENCIA: no entra a la
  plata, se suma aparte.

  Mauro, 15-oct-2026: «la interfaz en panel para ver todos los detalles de lo
  que se va acordando dentro del proyecto de General Flores… los links a los
  artefactos y documentos con su respaldo dentro del repositorio de datos.
  Puedo agregar padrones, planos, fotos, facturas, servicios, gastos,
  trabajos… balances de cuentas a pagar e ingresos; clara y simple como panel
  de acceso».

  DÓNDE VIVE: en `proyectos/<id>` de ESTA base, con `clase: "obra"` y todo lo
  de la obra adentro del campo `obra` (`datos` y `items`, como MAPAS: dos
  teléfonos no se pisan). La regla de `proyectos/` ya deja leer y escribir a
  Mauro y al agente: sin colección ni regla nuevas. Un invitado no lo ve
  salvo que Mauro le habilite ese proyecto.

  EL RESPALDO no va a este repositorio, que es PÚBLICO: va a la bodega
  (`maurogasta-crypto/bodega`, privada). Lo hace la ronda con
  `herramientas/obras.mjs respaldar`: baja cada archivo y la ficha entera a
  `obras/<id>/` y anota acá, en cada cosa, dónde quedó (`respaldo`). Un
  documento de claude.ai (el bosquejo del contrato) lo exporta la sesión.

  LA PLATA de acá es la de la obra: lo que se le cobra, lo que se le gasta y
  lo que hay que pagar, por moneda y sin convertir. Lo que se registra acá lo
  PROPONE la ronda en Tiempos (Plata, cuenta de la obra) para que el gestor
  central no lo pierda; nada se escribe dos veces por su cuenta.
  ════════════════════════════════════════════════════════════════
-->

<div id="barra">
  <div class="marca"><a href="./" class="volver" id="volverPanel" style="text-decoration:none">← Panel</a> · Proyectos<small id="sello"></small></div>
  <button class="btn hide" id="btnSalir" style="min-height:38px;padding:.4rem .8rem;font-size:.8rem;">Salir</button>
</div>

<div id="sin-sdk" class="contenedor hide">
  <h1>Falta Firebase</h1>
  <div class="tarj"><p id="sin-sdk-que" class="gris"></p>
    <div class="fila-btn"><button class="btn p" id="btnReintentar">Reintentar</button></div></div>
</div>

<div id="puerta" class="contenedor hide">
  <h1>Entrar</h1>
  <div class="tarj">
    <label for="mail">Mail</label>
    <input type="email" id="mail" inputmode="email" autocomplete="username">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" autocomplete="current-password">
    <div class="fila-btn"><button class="btn p" id="btnEntrar">Entrar</button></div>
  </div>
</div>

<div id="app" class="contenedor hide">
  <div id="obras" class="ob-obras"></div>
  <div id="obra"></div>
</div>

<script type="module">
import { P, $, db } from "./nucleo.js?v=nucleo-9";
import { doc, getDoc, getDocs, setDoc, collection, query, where, deleteField } from "./firebase-init.js?v=init-5";
P.PANEL = "obra-5";
P.pintarSello();

/* Los tipos de cosa que se le anotan a un proyecto. `plata`: si lleva monto;
   `signo`: +1 entra, −1 sale, 0 es un saldo pendiente (sale cuando se paga),
   y sin `signo` es una referencia que no entra a la cuenta (un presupuesto).
   `rubro`: si se le puede decir de qué es (materiales, jornales…). */
const TIPOS = {
  contrato:    { ic: "📜", n: "Contrato (definiciones)", grupo: "alquiler" },
  acuerdo:     { ic: "🤝", n: "Acuerdo",             grupo: "alquiler" },
  alquiler:    { ic: "🏠", n: "Cobro de alquiler",   grupo: "alquiler", plata: true, signo: 1 },
  trabajo:     { ic: "🔧", n: "Trabajo realizado",   grupo: "trabajos", plata: true, signo: -1, rubro: true },
  presupuesto: { ic: "📋", n: "Presupuesto",         grupo: "presupuestos", plata: true, rubro: true },
  apagar:      { ic: "⏳", n: "Saldo pendiente",     grupo: "pendientes", plata: true, signo: 0, rubro: true },
  gasto:       { ic: "💸", n: "Gasto pagado",        grupo: "plata", plata: true, signo: -1, rubro: true },
  ingreso:     { ic: "💵", n: "Ingreso (cobro, seña)", grupo: "plata", plata: true, signo: 1 },
  factura:     { ic: "🧾", n: "Factura",             grupo: "facturas", plata: true, signo: -1, rubro: true },
  servicio:    { ic: "💡", n: "Servicio (UTE, OSE…)", grupo: "facturas", plata: true, signo: -1 },
  documento:   { ic: "📄", n: "Documento",           grupo: "documentos" },
  plano:       { ic: "📐", n: "Plano",               grupo: "documentos" },
  foto:        { ic: "📷", n: "Foto",                grupo: "fotos" },
  nota:        { ic: "📝", n: "Nota",                grupo: "notas" },
};
const RUBROS = { materiales: "🧱 Materiales", jornales: "👷 Jornales", servicios: "💡 Servicios",
  honorarios: "📐 Honorarios", otros: "· Otros" };
const GRUPOS = [
  ["alquiler", "🏠", "Alquiler"], ["trabajos", "🔧", "Trabajos realizados"], ["presupuestos", "📋", "Presupuestos"],
  ["pendientes", "⏳", "Saldos pendientes"], ["plata", "💵", "Plata"], ["facturas", "🧾", "Facturas y servicios"],
  ["documentos", "📄", "Documentos y planos"], ["fotos", "📷", "Fotos"], ["notas", "📝", "Notas"], ["datos", "🏷", "Datos"],
];
const cuenta = (t) => t.plata && t.signo !== undefined;
const MONEDAS = ["UYU", "USD", "BRL"];
let invitado = null;     // la ficha de `personas/` si quien entra es un invitado
let OBRAS = [], abierta = null, unidad = null, grupo = "todo", agregando = null;

async function arrancar() {
  for (const id of ["sin-sdk", "puerta", "app"]) $(id).classList.add("hide");
  if (!(await P.arrancarFirebase())) {
    $("sin-sdk-que").textContent = P.fallaFirebase ? P.fallaFirebase.message : "No bajó el SDK.";
    $("sin-sdk").classList.remove("hide"); return;
  }
  const yo = await P.quienEntra();
  if (!yo) { $("puerta").classList.remove("hide"); return; }
  $("btnSalir").classList.remove("hide");
  const f = await getDoc(doc(db, "personas", yo.uid)).catch(() => null);
  invitado = f && f.exists() ? f.data() : null;
  if (invitado && invitado.activo !== true) { location.replace("invitado.html"); return; }
  document.body.classList.toggle("solo-ver", !!invitado);
  if (invitado) $("volverPanel").href = "./invitado.html";
  $("app").classList.remove("hide");
  await leer();
}
$("btnReintentar").onclick = arrancar;
$("btnEntrar").onclick = async () => {
  try { await P.entrar($("mail").value, $("clave").value); location.reload(); }
  catch (e) { P.aviso(P.explicar(e), "error"); }
};
$("btnSalir").onclick = async () => { await P.salir(); location.reload(); };

async function leer() {
  try {
    const docs = invitado
      ? (await Promise.all((invitado.proyectos || []).map((id) => getDoc(doc(db, "proyectos", id)).catch(() => null))))
          .filter((d) => d && d.exists() && d.data().clase === "obra")
      : (await getDocs(query(collection(db, "proyectos"), where("clase", "==", "obra")))).docs;
    OBRAS = docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre)));
  } catch (e) { $("obra").innerHTML = `<p class="gris">${P.esc(P.explicar(e))}</p>`; return; }
  const q = new URLSearchParams(location.search);
  if (!abierta || !OBRAS.some((o) => o.id === abierta)) abierta = (OBRAS.find((o) => o.id === q.get("o")) || OBRAS[0] || {}).id || null;
  const o = OBRAS.find((x) => x.id === abierta);
  if (unidad === null && o && listaUnidades(o).some((u) => u.id === q.get("u"))) { unidad = q.get("u"); grupo = "todo"; }
  if (o && unidad && !listaUnidades(o).some((u) => u.id === unidad)) unidad = null;
  pintar();
}

/* ---------- las cuentas de la obra, por moneda ---------- */
function plataDe(items) {
  const out = {};
  for (const x of items) {
    const t = TIPOS[x.tipo];
    if (!t || !cuenta(t) || !(Number(x.monto) > 0) || !MONEDAS.includes(x.moneda)) continue;
    const o = (out[x.moneda] = out[x.moneda] || { entro: 0, salio: 0, aPagar: 0 });
    const v = Number(x.monto);
    if (t.signo === 1) o.entro += v;
    else if (t.signo === -1 || x.pagado) o.salio += v;
    else o.aPagar += v;
  }
  return out;
}
/* Por rubro y por moneda: lo pendiente, o lo presupuestado. */
function porRubro(items) {
  const out = {};
  for (const x of items) {
    if (!(Number(x.monto) > 0) || !MONEDAS.includes(x.moneda)) continue;
    const k = (RUBROS[x.rubro] ? x.rubro : "otros") + "|" + x.moneda;
    out[k] = (out[k] || 0) + Number(x.monto);
  }
  return Object.entries(out).map(([k, v]) => { const [r, m] = k.split("|"); return { rubro: r, moneda: m, monto: v }; })
    .sort((a, b) => Object.keys(RUBROS).indexOf(a.rubro) - Object.keys(RUBROS).indexOf(b.rubro) || a.moneda.localeCompare(b.moneda));
}
const resumenHTML = (filas, titulo) => filas.length ? `<p class="gris" style="margin:.4rem 0 .1rem">${titulo}</p><div class="ob-resumen">${filas.map((f) =>
  `<span>${P.esc(RUBROS[f.rubro])}</span><span class="n">${fmt(f.monto)} ${P.esc(f.moneda)}</span>`).join("")}</div>` : "";
/* «2026-10-15» es un día, no un instante: con new Date() a secas el día se lee
   en UTC y en Uruguay aparece el anterior. */
const dia = (iso) => P.fecha(/^\d{4}-\d{2}-\d{2}$/.test(String(iso || "")) ? iso + "T12:00" : iso);
const fmt = (n) => (Math.round(n * 100) / 100).toLocaleString("es", { maximumFractionDigits: 2 });
const listaItems = (o) => Object.entries((o.obra && o.obra.items) || {}).map(([id, v]) => ({ id, ...(v || {}) }))
  .filter((x) => TIPOS[x.tipo]).sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")) || String(b.creadoEn || "").localeCompare(String(a.creadoEn || "")));
const listaDatos = (o, u = "") => Object.entries((o.obra && o.obra.datos) || {}).map(([id, v]) => ({ id, ...(v || {}) }))
  .filter((d) => d.etiqueta && (d.unidad || "") === (u || "")).sort((a, b) => (a.orden || 0) - (b.orden || 0) || String(a.etiqueta).localeCompare(String(b.etiqueta)));
const listaUnidades = (o) => Object.entries((o.obra && o.obra.unidades) || {}).map(([id, v]) => ({ id, ...(v || {}) }))
  .filter((u) => u.nombre).sort((a, b) => (a.orden || 0) - (b.orden || 0) || String(a.nombre).localeCompare(String(b.nombre)));
const deAca = (x, u) => (x.unidad || "") === (u || "");
const enlaceSeguro = (u) => /^https:\/\/\S+$/.test(String(u || ""));

const enGrupo = (x, g) => TIPOS[x.tipo].grupo === g || (g === "plata" && cuenta(TIPOS[x.tipo]) && Number(x.monto) > 0);
const datosHTML = (datos, titulo, boton) => `<div class="tarj"><div class="k">${titulo}</div>
  ${datos.map((d) => `<div class="ob-dato"><span class="k2">${P.esc(d.etiqueta)}</span><span>${P.esc(d.valor || "—")} <button class="mini" data-dato="${P.esc(d.id)}" aria-label="Cambiar">✎</button></span></div>`).join("") || `<p class="gris">Nada todavía.</p>`}
  <div class="fila-btn"><button class="mini" data-dato="">${boton}</button></div></div>`;
const plataTexto = (plata) => Object.entries(plata).filter(([, x]) => x.aPagar).map(([m, x]) => `${fmt(x.aPagar)} ${m}`).join(" · ");

/* La tarjeta de un alquiler en la vista del local: es un ENLACE, no un botón
   (el volver también: ver la regla del panel sobre history.back). */
function unidadHTML(o, u, todos) {
  const suyos = todos.filter((x) => x.unidad === u.id);
  const pend = plataTexto(plataDe(suyos.filter((x) => x.tipo === "apagar" && !x.pagado)));
  return `<a class="ob-unidad" href="?o=${encodeURIComponent(o.id)}&u=${encodeURIComponent(u.id)}">
    <span class="ic">${P.esc(u.icono || "🏠")}</span>
    <span class="tx"><b>${P.esc(u.nombre)}</b>
      <small>${P.esc(u.arrendatario || "arrendatario sin definir")}${u.estado ? " · " + P.esc(u.estado) : ""}</small>
      <small class="gris">${suyos.length} cosa${suyos.length === 1 ? "" : "s"} anotada${suyos.length === 1 ? "" : "s"}${pend ? ` · <span class="ob-mal">pendiente ${P.esc(pend)}</span>` : ""}</small></span>
    <span class="ir">›</span></a>`;
}

function pintar() {
  $("obras").innerHTML = OBRAS.length > 1 && !unidad ? OBRAS.map((o) => `<button class="mini${o.id === abierta ? " p" : ""}" data-obra="${P.esc(o.id)}">${P.esc(o.nombre || o.id)}</button>`).join("") : "";
  const o = OBRAS.find((x) => x.id === abierta);
  if (!o) { $("obra").innerHTML = `<p class="gris">${invitado ? "Todavía no tenés proyectos habilitados." : "Todavía no hay proyectos. Los crea Claude a pedido."}</p>`; enganchar(); return; }
  const todos = listaItems(o), unidades = listaUnidades(o), ob = o.obra || {};
  const u = unidad ? unidades.find((x) => x.id === unidad) : null;
  const items = todos.filter((x) => deAca(x, unidad)), datos = listaDatos(o, unidad);
  const grupos = GRUPOS.filter(([g]) => u ? g !== "datos" : g !== "alquiler");
  const cuantos = (g) => items.filter((x) => enGrupo(x, g)).length + ((g === "alquiler" || g === "datos") ? datos.length : 0);
  /* La plata del LOCAL suma todo, alquileres incluidos; la de un alquiler, lo suyo. */
  const base = u ? items : todos;
  const plata = plataDe(base);
  const pendientes = base.filter((x) => x.tipo === "apagar" && !x.pagado).sort((a, b) => String(a.vence || "9").localeCompare(String(b.vence || "9")));
  const presupuestos = items.filter((x) => x.tipo === "presupuesto");
  const visibles = grupo === "todo" ? items : items.filter((x) => enGrupo(x, grupo));
  const nombreUnidad = (x) => { const v = x.unidad && unidades.find((y) => y.id === x.unidad); return v ? ` <span class="k2">${P.esc(v.nombre)}</span>` : ""; };

  $("obra").innerHTML = `
    ${u ? `<p style="margin:.2rem 0 0"><a href="?o=${encodeURIComponent(o.id)}" class="volver">← ${P.esc(o.nombre || o.id)}</a></p>
      <div class="ob-cab"><h1>${P.esc(u.icono || "🏠")} ${P.esc(u.nombre)}</h1>
        <p class="ob-dir">Arrendatario: ${P.esc(u.arrendatario || "sin definir")}${u.estado ? " · " + P.esc(u.estado) : ""}
          <button class="mini" data-unidad-editar="${P.esc(u.id)}">✎</button></p></div>`
    : `<div class="ob-cab"><h1>${P.esc(o.nombre || o.id)}</h1>
      <p class="ob-dir">${P.esc(ob.direccion || "")}${ob.resumen ? " · " + P.esc(ob.resumen) : ""}</p></div>
      <div class="tarj"><div class="k">Los alquileres</div>
        ${unidades.map((x) => unidadHTML(o, x, todos)).join("") || `<p class="gris">Todavía no hay alquileres.</p>`}
        <div class="fila-btn"><button class="mini" data-unidad-nueva>＋ Alquiler (consultorio, local, depósito…)</button></div></div>
      <h2 class="ob-sub">Lo general del local</h2>`}

    <div class="ob-tiles">
      <button class="ob-tile${grupo === "todo" ? " on" : ""}" data-grupo="todo"><b>🗂</b><span>Todo</span><small>${items.length}</small></button>
      ${grupos.map(([g, ic, n]) => `<button class="ob-tile${grupo === g ? " on" : ""}" data-grupo="${g}"><b>${ic}</b><span>${n}</span><small>${cuantos(g)}</small></button>`).join("")}
    </div>

    ${["todo", "plata", "pendientes"].includes(grupo) ? `<div class="tarj"><div class="k">${u ? "La plata de este alquiler" : "La plata de todo el local (alquileres incluidos)"}</div>
      ${Object.keys(plata).length ? `<div class="ob-plata"><span></span><span class="gris n">entró</span><span class="gris n">salió</span><span class="gris n">pendiente</span>
        ${Object.entries(plata).map(([m, x]) => `<b>${m}</b><span class="n ob-ok">${fmt(x.entro)}</span><span class="n">${fmt(x.salio)}</span><span class="n${x.aPagar ? " ob-mal" : ""}">${fmt(x.aPagar)}</span>`).join("")}</div>`
        : `<p class="gris">Todavía no hay montos anotados.</p>`}
      ${resumenHTML(porRubro(pendientes), "Pendiente, por rubro:")}
      ${pendientes.length ? `<p class="gris" style="margin:.6rem 0 .2rem">Por pagar:</p>${pendientes.map((x) => `<div class="ob-dato"><span>${P.esc(x.titulo)}${u ? "" : nombreUnidad(x)}${x.rubro && RUBROS[x.rubro] ? ` <span class="k2">${P.esc(RUBROS[x.rubro])}</span>` : ""}${x.vence ? ` <span class="k2">vence ${P.esc(dia(x.vence))}</span>` : ""}</span><span class="m">${fmt(x.monto)} ${P.esc(x.moneda)} <button class="mini" data-pagar="${P.esc(x.id)}">Pagado</button></span></div>`).join("")}` : ""}
      <p class="gris" style="font-size:.78rem">Cada moneda va aparte. Los presupuestos no entran acá: se suman en su sección.</p></div>` : ""}

    ${grupo === "presupuestos" ? `<div class="tarj"><div class="k">Presupuestado</div>
      ${resumenHTML(porRubro(presupuestos), "Por rubro:") || `<p class="gris">Todavía no hay presupuestos con monto.</p>`}
      <p class="gris" style="font-size:.78rem">Es una referencia: lo que se paga se anota como trabajo, gasto o saldo pendiente.</p></div>` : ""}

    ${u && (grupo === "alquiler" || grupo === "todo") ? datosHTML(datos, "Datos del arrendamiento", "＋ Dato (precio, plazo, garantía…)") : ""}
    ${!u && (grupo === "datos" || grupo === "todo") ? datosHTML(datos, "Datos generales del local", "＋ Dato (padrón, superficie, escribano…)") : ""}

    <div class="fila-btn"><button class="btn p" data-gasto-foto>📷 Gasto con foto</button><button class="btn" data-agregar="${grupo === "todo" || grupo === "datos" ? "" : grupo}">＋ Agregar ${grupo === "todo" || grupo === "datos" ? (u ? "a " + P.esc(u.nombre) : "al local") : "a " + (GRUPOS.find((g) => g[0] === grupo) || [, , ""])[2].toLowerCase()}</button></div>
    ${agregando ? formHTML() : ""}

    ${grupo === "datos" ? "" : `<div class="tarj">${visibles.map(itemHTML).join("") || `<p class="gris">Nada en esta sección todavía.</p>`}</div>`}
  `;
  enganchar();
}

function itemHTML(x) {
  const t = TIPOS[x.tipo];
  const img = P.esImagenNuestra(x.imagen) ? x.imagen : "";
  return `<div class="ob-item">
    <div class="t"><span>${t.ic}</span><b>${P.esc(x.titulo || t.n)}</b>${Number(x.monto) > 0 ? `<span class="m${t.signo === 1 ? " ob-ok" : ""}">${t.signo === 1 ? "+" : t.signo === undefined ? "" : "−"}${fmt(x.monto)} ${P.esc(x.moneda || "")}</span>` : ""}</div>
    <div class="ob-meta">${P.esc(t.n)}${t.rubro && RUBROS[x.rubro] ? " · " + P.esc(RUBROS[x.rubro]) : ""}${x.fecha ? " · " + P.esc(dia(x.fecha)) : ""}${x.tipo === "apagar" ? (x.pagado ? " · pagado" : x.vence ? " · vence " + P.esc(dia(x.vence)) : " · a pagar") : ""}${x.respaldo ? " · 💾 respaldado" : (x.url || img) ? " · sin respaldo todavía" : ""}</div>
    ${x.texto ? `<p>${P.esc(x.texto)}</p>` : ""}
    ${x.factura && facturaTexto(x.factura) ? `<div class="ob-meta">🧾 ${P.esc(facturaTexto(x.factura))}</div>` : ""}
    ${img ? `<a href="${P.esc(img)}" target="_blank" rel="noopener"><img src="${P.esc(img)}" alt="${P.esc(x.titulo || "")}" loading="lazy"></a>` : ""}
    ${enlaceSeguro(x.url) ? `<a href="${P.esc(x.url)}" target="_blank" rel="noopener">Abrir ↗</a>` : ""}
    <div class="fila-btn" style="margin-top:.2rem"><button class="mini" data-sacar="${P.esc(x.id)}">Sacar</button></div>
  </div>`;
}

function formHTML() {
  const a = agregando;
  const opciones = Object.entries(TIPOS).filter(([, t]) => (!a.grupo || t.grupo === a.grupo || (a.grupo === "plata" && cuenta(t))) && (unidad || a.grupo || t.grupo !== "alquiler"));
  const t = TIPOS[a.tipo] || {};
  const fotoBtns = `<label class="mini">📷 Sacar foto<input type="file" accept="image/*" capture="environment" data-foto hidden></label>
      <label class="mini">🖼 Elegir imagen<input type="file" accept="image/*" data-foto hidden></label>`;
  const estadoFoto = a.leyendo ? `<span class="gris">✨ Leyendo la factura…</span>`
    : a.archivo ? `<span class="gris">${P.esc(a.archivo.name)} · ${a.leida ? "✨ leída por la IA: revisá" : "se sube al guardar"}</span>` : "";
  return `<div class="tarj ob-form" id="form-obra">
    ${t.plata ? `<div class="k">La foto de la factura</div>
      <div class="fila-btn">${fotoBtns}${estadoFoto}</div>
      <p class="gris" style="font-size:.8rem;margin:.2rem 0 .6rem">La IA completa lo que puede; lo que no se lee con seguridad queda vacío. Sin foto, se carga a mano.</p>` : ""}
    <label>Qué es <select data-f="tipo">${opciones.map(([k, x]) => `<option value="${k}"${a.tipo === k ? " selected" : ""}>${x.ic} ${P.esc(x.n)}</option>`).join("")}</select></label>
    <label>Título <input data-f="titulo" maxlength="120" value="${P.esc(a.titulo || "")}" placeholder="Ej.: Arena y portland · Jornal de Pedro · Presupuesto eléctrico"></label>
    <div class="dos"><label>Fecha <input type="date" data-f="fecha" value="${P.esc(a.fecha || P.hoy())}"></label>
      ${a.tipo === "apagar" ? `<label>Vence <input type="date" data-f="vence" value="${P.esc(a.vence || "")}"></label>` : ""}</div>
    ${t.plata ? `<div class="dos"><label>Monto <input type="number" step="0.01" min="0" data-f="monto" value="${P.esc(a.monto || "")}"></label>
      <label>Moneda <select data-f="moneda">${MONEDAS.map((m) => `<option${(a.moneda || "UYU") === m ? " selected" : ""}>${m}</option>`).join("")}</select></label></div>` : ""}
    ${t.rubro ? `<label>Rubro <select data-f="rubro">${Object.entries(RUBROS).map(([k, n]) => `<option value="${k}"${(a.rubro || "materiales") === k ? " selected" : ""}>${n}</option>`).join("")}</select></label>` : ""}
    <label>Detalle <textarea data-f="texto" rows="3" maxlength="2000" placeholder="Qué se acordó, qué se hizo, quién, cuánto…">${P.esc(a.texto || "")}</textarea></label>
    <label>Enlace (documento, artefacto, carpeta) <input type="url" data-f="url" maxlength="500" value="${P.esc(a.url || "")}" placeholder="https://…"></label>
    ${t.plata ? "" : `<div class="fila-btn">${fotoBtns}${estadoFoto}</div>`}
    ${a.factura ? `<p class="gris" style="font-size:.8rem">${P.esc(facturaTexto(a.factura))}</p>` : ""}
    <div class="fila-btn"><button class="btn p" data-guardar${a.leyendo ? " disabled" : ""}>Guardar</button><button class="mini" data-cancelar>Cancelar</button></div>
  </div>`;
}

const facturaTexto = (f) => [f.rut && "RUT " + f.rut, f.numero && "N.º " + f.numero, f.medio && P.MEDIOS_PAGO[f.medio],
  f.renglones && f.renglones.length + (f.renglones.length === 1 ? " renglón" : " renglones")].filter(Boolean).join(" · ");

/* La foto, leída por la IA: completa lo que está VACÍO, y además la moneda,
   la fecha y el rubro, que en el formulario son valores por defecto. */
async function leerFoto(file) {
  const a = agregando;
  a.leyendo = true; pintar();
  try {
    const s = await P.leerFactura(file, { rubros: Object.keys(RUBROS) });
    if (agregando !== a) return;
    if (s) {
      const titulo = [s.comercio, s.detalle].filter(Boolean).join(" · ").slice(0, 120);
      if (!String(a.titulo || "").trim() && titulo) a.titulo = titulo;
      if (!(Number(a.monto) > 0) && s.monto) a.monto = s.monto;
      if (s.moneda) a.moneda = s.moneda;
      if (s.fecha) a.fecha = s.fecha;
      if (s.rubro) a.rubro = s.rubro;
      if (!String(a.texto || "").trim()) {
        const r = (s.factura && s.factura.renglones || []).map((x) => "· " + x.d + (x.m ? " — " + fmt(x.m) : "")).join("\n");
        a.texto = [s.detalle, r].filter(Boolean).join("\n").slice(0, 2000);
      }
      a.factura = s.factura; a.leida = true;
    } else P.aviso("La IA no pudo leer la factura: completala a mano.", "error");
  } catch (e) { P.aviso("No se pudo leer con IA (" + e.message + "): completala a mano.", "error"); }
  a.leyendo = false;
  if (agregando === a) pintar();
}

function leerForm() {
  const f = $("form-obra"); if (!f || !agregando) return;
  for (const el of f.querySelectorAll("[data-f]")) agregando[el.dataset.f] = el.value;
}

/* Sólo la parte de ESTA obra, con merge: lo que otro teléfono agregó en el
   medio queda. */
function guardar(campos) {
  return setDoc(doc(db, "proyectos", abierta), { obra: campos, actualizadoEn: P.hoy() }, { merge: true });
}
const idNuevo = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const recargar = () => leer().catch((e) => P.aviso(P.explicar(e), "error"));

function enganchar() {
  for (const b of document.querySelectorAll("[data-obra]")) b.onclick = () => { abierta = b.dataset.obra; unidad = null; grupo = "todo"; agregando = null; pintar(); };
  for (const b of document.querySelectorAll("[data-unidad-nueva], [data-unidad-editar]")) b.onclick = async () => {
    const o = OBRAS.find((x) => x.id === abierta), v = listaUnidades(o).find((x) => x.id === b.dataset.unidadEditar);
    const nombre = (prompt("Qué se alquila (Gimnasio, Consultorio 1, Depósito…):", v ? v.nombre : "") || "").trim();
    if (!nombre) return;
    const arrendatario = prompt("Arrendatario (nombre; vacío si todavía no hay):", v ? v.arrendatario || "" : "");
    if (arrendatario === null) return;
    const estado = prompt("En qué está (ej.: conversando · seña recibida · contrato firmado):", v ? v.estado || "" : "");
    if (estado === null) return;
    const id = v ? v.id : (P.slug(nombre).slice(0, 40) || idNuevo("u"));
    if (!v && listaUnidades(o).some((x) => x.id === id)) return P.aviso("Ya hay un alquiler con ese nombre.", "error");
    try {
      await guardar({ unidades: { [id]: { nombre: nombre.slice(0, 60), arrendatario: arrendatario.trim().slice(0, 120), estado: estado.trim().slice(0, 120), orden: v ? v.orden || 0 : 50 } } });
      await recargar();
    } catch (e) { P.aviso(P.explicar(e), "error"); }
  };
  for (const b of document.querySelectorAll("[data-grupo]")) b.onclick = () => { grupo = b.dataset.grupo; agregando = null; pintar(); };
  for (const b of document.querySelectorAll("[data-gasto-foto]")) b.onclick = () => {
    const tipo = { pendientes: "apagar", trabajos: "trabajo", facturas: "factura", presupuestos: "presupuesto" }[grupo] || "gasto";
    agregando = { grupo: "", tipo }; pintar();
    const f = $("form-obra"); if (f) f.scrollIntoView({ block: "start" });
  };
  for (const b of document.querySelectorAll("[data-agregar]")) b.onclick = () => {
    const g = b.dataset.agregar;
    const tipo = (Object.entries(TIPOS).find(([, t]) => t.grupo === g) || ["nota"])[0];
    agregando = { grupo: g, tipo }; pintar();
    const f = $("form-obra"); if (f) f.scrollIntoView({ block: "start" });
  };
  const f = $("form-obra");
  if (f) {
    f.oninput = leerForm;
    f.querySelector('[data-f="tipo"]').onchange = () => { leerForm(); pintar(); };
    for (const i of f.querySelectorAll("[data-foto]")) i.onchange = () => {
      leerForm(); const file = i.files && i.files[0] || null;
      agregando.archivo = file; agregando.leida = false; agregando.factura = null;
      if (file && TIPOS[agregando.tipo] && TIPOS[agregando.tipo].plata) leerFoto(file); else pintar();
    };
    f.querySelector("[data-cancelar]").onclick = () => { agregando = null; pintar(); };
    f.querySelector("[data-guardar]").onclick = async (ev) => {
      leerForm();
      const a = agregando, t = TIPOS[a.tipo];
      if (!t) return P.aviso("Elegí qué es.", "error");
      if (!String(a.titulo || "").trim() && !String(a.texto || "").trim()) return P.aviso("Poné un título o un detalle.", "error");
      if (a.url && !enlaceSeguro(a.url.trim())) return P.aviso("El enlace tiene que empezar con https://", "error");
      const monto = Math.round(Number(a.monto) * 100) / 100;
      if (t.plata && a.monto !== undefined && a.monto !== "" && !(monto > 0)) return P.aviso("El monto tiene que ser mayor que cero.", "error");
      ev.target.disabled = true;
      try {
        let imagen = "";
        if (a.archivo) { P.aviso("Subiendo la imagen…"); imagen = await P.subirCaptura(a.archivo); }
        const item = { tipo: a.tipo, titulo: String(a.titulo || "").trim().slice(0, 120), fecha: a.fecha || P.hoy(),
          texto: String(a.texto || "").trim().slice(0, 2000), creadoEn: new Date().toISOString() };
        if (a.url && a.url.trim()) item.url = a.url.trim().slice(0, 500);
        if (imagen) item.imagen = imagen;
        if (t.plata && monto > 0) { item.monto = monto; item.moneda = MONEDAS.includes(a.moneda) ? a.moneda : "UYU"; }
        if (unidad) item.unidad = unidad;
        if (t.plata && a.factura) item.factura = a.factura;
        if (t.rubro) item.rubro = RUBROS[a.rubro] ? a.rubro : "materiales";
        if (a.tipo === "apagar") { item.pagado = false; if (a.vence) item.vence = a.vence; }
        await guardar({ items: { [idNuevo("i")]: item } });
        agregando = null; P.aviso("Guardado."); await recargar();
      } catch (e) { ev.target.disabled = false; P.aviso(P.explicar(e), "error"); }
    };
  }
  for (const b of document.querySelectorAll("[data-pagar]")) b.onclick = async () => {
    try { await guardar({ items: { [b.dataset.pagar]: { pagado: true, pagadoEl: P.hoy() } } }); await recargar(); }
    catch (e) { P.aviso(P.explicar(e), "error"); }
  };
  for (const b of document.querySelectorAll("[data-sacar]")) b.onclick = async () => {
    if (!(await P.preguntar("¿Sacar esto del proyecto? (Si tiene respaldo en la bodega, el respaldo queda.)"))) return;
    try { await guardar({ items: { [b.dataset.sacar]: deleteField() } }); await recargar(); }
    catch (e) { P.aviso(P.explicar(e), "error"); }
  };
  for (const b of document.querySelectorAll("[data-dato]")) b.onclick = async () => {
    const o = OBRAS.find((x) => x.id === abierta), d = listaDatos(o, unidad).find((x) => x.id === b.dataset.dato);
    const etiqueta = d ? d.etiqueta : (prompt(unidad ? "Qué dato del alquiler (precio, plazo, garantía…):" : "Qué dato (padrón, superficie, escribano…):") || "").trim();
    if (!etiqueta) return;
    const valor = prompt(etiqueta + ":", d ? d.valor || "" : "");
    if (valor === null) return;
    const id = d ? d.id : (unidad ? unidad + "-" : "") + (P.slug(etiqueta).slice(0, 40) || idNuevo("d"));
    try {
      await guardar({ datos: { [id]: valor.trim() ? { etiqueta: etiqueta.slice(0, 60), valor: valor.trim().slice(0, 300), orden: d ? d.orden || 0 : 50, ...(unidad ? { unidad } : {}) } : deleteField() } });
      await recargar();
    } catch (e) { P.aviso(P.explicar(e), "error"); }
  };
}

arrancar();
</script>
</body>
</html>
