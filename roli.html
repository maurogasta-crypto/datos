<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Roli, el robot</title>
<link rel="stylesheet" href="estilos.css?v=estilos-14">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="./icono-192.png">
<style>
  .ro-niveles { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0; }
  .ro-niveles button { flex: 1 1 5.5rem; min-height: 48px; font-size: .85rem; }
  .ro-niveles button[aria-pressed="true"] { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  .ro-act { background: var(--tinta2); border: 1px solid var(--linea); border-radius: var(--r); margin: .6rem 0; }
  .ro-act > summary { list-style: none; cursor: pointer; padding: .8rem; display: flex; gap: .6rem; align-items: center; min-height: 56px; }
  .ro-act > summary::-webkit-details-marker { display: none; }
  .ro-act .ic { font-size: 1.6rem; }
  .ro-act .n { flex: 1; font-weight: 600; font-size: 1.05rem; }
  .ro-act .n small { display: block; font-weight: 400; color: var(--gris); font-size: .8rem; }
  .ro-act .cta { font-family: var(--mono); font-size: .8rem; color: var(--gris); }
  .ro-act .cta.ok { color: var(--ok); }
  .ro-cuerpo { padding: 0 .8rem .8rem; }
  .ro-cosas { color: var(--gris); font-size: .86rem; margin: 0 0 .4rem; padding-left: 1.1rem; }
  .ro-aviso { font-size: .84rem; color: var(--ojo); border: 1px solid var(--ojo); border-radius: var(--r); padding: .4rem .6rem; margin: .4rem 0; }
  .ro-paso { display: flex; gap: .6rem; padding: .7rem 0; border-top: 1px solid var(--linea); }
  .ro-paso input { width: 28px; height: 28px; flex: none; accent-color: var(--ok); margin-top: .1rem; }
  .ro-paso .t { flex: 1; }
  .ro-paso.hecho .t > b { color: var(--gris); text-decoration: line-through; }
  .ro-paso code { display: inline-block; background: var(--tinta3); border: 1px solid var(--linea); border-radius: 6px; padding: .15rem .45rem; margin: .15rem .2rem .15rem 0; font-family: var(--mono); font-size: .95rem; color: var(--acento); }
  .ro-ve { color: var(--ok); font-size: .88rem; margin: .2rem 0 0; }
  .ro-des { margin-top: .6rem; padding: .6rem; border: 1px dashed var(--acento); border-radius: var(--r); font-size: .92rem; }
  .ro-tabs { display: flex; gap: .4rem; margin: .4rem 0; }
  .ro-tabs button { flex: 1; min-height: 48px; }
  .ro-tabs button[aria-pressed="true"] { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  .ro-comp { padding: .6rem 0; border-top: 1px solid var(--linea); }
  .ro-comp .t { display: flex; gap: .5rem; align-items: baseline; }
  .ro-comp .t b { flex: 1; font-weight: 500; }
  .ro-comp .usd { font-family: var(--mono); white-space: nowrap; font-size: .85rem; }
  .ro-comp .para { color: var(--gris); font-size: .88rem; margin: .2rem 0; }
  .ro-comp .ojo { color: var(--ojo); font-size: .84rem; margin: .2rem 0; }
  .ro-tres { display: flex; gap: .3rem; margin-top: .3rem; }
  .ro-tres button { flex: 1; min-height: 44px; font-size: .85rem; }
  .ro-tres button.on { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  .ro-grupo { font-weight: 600; margin: 1rem 0 .2rem; }
  .ro-hoy { display: inline-block; background: var(--acento); color: var(--tinta); border-radius: 999px; padding: .05rem .6rem; font-size: .8rem; font-weight: 700; margin-left: .4rem; }
  .ro-pts { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .4rem 0; font-size: .9rem; }
  .ro-pts label { display: flex; gap: .3rem; align-items: center; }
  .ro-pts input[type=number] { width: 4.2rem; min-height: 44px; }
  .ro-hoja input[type=text] { width: 100%; min-height: 44px; }
  .ro-total { font-size: 1.05rem; margin: .4rem 0; }
  .ro-med { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .ro-med label { font-size: .85rem; color: var(--gris); display: block; }
  .ro-med input { width: 100%; min-height: 44px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="hoja.css?v=hoja-2">
</head>
<body>
<!--
  roli.html — las actividades de Roli, la dinámica de juego del día y lo que conviene comprarle. Sello: roli-js-5

  Mauro, 10-nov-2026. Esta página sólo DIBUJA: las actividades, las palabras
  y las compras viven en `roli.js`, que se prueba sin navegador (`node
  pruebas/roli.mjs`). Sin Firebase y sin cuenta, a propósito: la abren los
  chicos desde la laptop del robot. Lo que se tilda se recuerda en ESTE
  navegador (localStorage), no en el panel.
  Se llega desde la ficha de Roli (`sitio.guias` de `proyectos/roli`).
-->
<div id="barra">
  <div class="marca"><a href="./" class="volver" style="text-decoration:none">← Panel</a> · Roli<small id="sello"></small></div>
</div>
<main style="padding:.6rem .8rem 4rem;max-width:44rem;margin:0 auto">
  <div class="ro-tabs" role="tablist">
    <button class="btn" id="tAct" aria-pressed="true">🤖 Actividades</button>
    <button class="btn" id="tJug" aria-pressed="false">🎮 Jugar hoy</button>
    <button class="btn" id="tCom" aria-pressed="false">🛒 Para comprar</button>
  </div>
  <section id="vAct">
    <p class="gris" style="margin:.2rem 0">Elegí un nivel y seguí los pasos. Lo que escribís va en la consola de la laptop, una línea por vez.</p>
    <div class="ro-niveles" id="niveles"></div>
    <div id="acts"></div>
  </section>
  <section id="vJug" hidden>
    <div id="jugar"></div>
  </section>
  <section id="vCom" hidden>
    <p class="gris" style="margin:.2rem 0">Lo que recomendamos sumarle a Roli. Los precios son aproximados, en dólares, y se confirman al comprar. Lo que marcás se recuerda en este navegador.</p>
    <div id="total" class="tarj"></div>
    <div id="compras"></div>
  </section>
</main>
<script type="module">
import * as R from "./roli.js";
const $ = (id) => document.getElementById(id);
$("sello").textContent = " · " + R.VERSION;
const guardado = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let hechos = guardado("roli_hechos", {}), compras = guardado("roli_compras", {}), nivel = guardado("roli_nivel", 1);
const abiertas = new Set();

function pintarActs() {
  $("niveles").innerHTML = R.NIVELES.map((n) =>
    '<button class="btn" data-n="' + n.n + '" aria-pressed="' + (n.n === nivel) + '">' + n.ic + " " + n.n + "<br><small>" + R.esc(n.t) + "</small></button>").join("");
  $("acts").innerHTML = R.ACTIVIDADES.filter((a) => a.nivel === nivel).map((a) => {
    const hs = a.pasos.filter((_, i) => hechos[a.id + ":" + i]).length;
    let h = '<details class="ro-act" data-a="' + a.id + '"' + (abiertas.has(a.id) ? " open" : "") + '><summary><span class="ic">' + a.ic + '</span><span class="n">' + R.esc(a.titulo)
      + "<small>" + R.esc(a.meta) + '</small></span><span class="cta' + (hs === a.pasos.length ? " ok" : "") + '">' + hs + "/" + a.pasos.length + "</span></summary><div class=\"ro-cuerpo\">";
    if (a.ojos) h += '<p class="ro-aviso">' + R.esc(R.AVISO_OJOS) + "</p>";
    h += '<ul class="ro-cosas">' + a.cosas.map((c) => "<li>" + R.esc(c) + "</li>").join("") + "</ul>";
    a.pasos.forEach((p, i) => {
      const ok = hechos[a.id + ":" + i];
      h += '<div class="ro-paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-p="' + a.id + ":" + i + '"' + (ok ? " checked" : "") + ' aria-label="Hecho">'
        + '<div class="t"><b>' + (i + 1) + ". " + R.esc(p.t) + "</b><br>" + (p.escribi || []).map((c) => "<code>" + R.esc(c) + "</code>").join("")
        + (p.ve ? '<p class="ro-ve">👉 ' + R.esc(p.ve) + "</p>" : "") + "</div></div>";
    });
    return h + '<div class="ro-des">🏆 <b>Desafío:</b> ' + R.esc(a.desafio) + "</div></div></details>";
  }).join("");
}

/* ── Jugar hoy: la dinámica del día, en equipo (se recuerda en ESTE navegador) ── */
const HOY = new Date().toISOString().slice(0, 10);
let din = R.DINAMICAS.find((d) => d.id === guardado("roli_juego_elegido", "")) || R.dinamicaDe(HOY);
const equipoGuardado = guardado("roli_equipo", ["Persona 1", "Persona 2", "Persona 3"]);
const cargarJuego = () => { const j = guardado("roli_juego3_" + din.id, null) || { est: {}, medidas: {}, hechos: {} }; j.jugadores = equipoGuardado; return j; };
let juego = din ? cargarJuego() : null;
const guardarJuego = () => { guardar("roli_equipo", juego.jugadores); const { jugadores, ...resto } = juego; guardar("roli_juego3_" + din.id, resto); };
const abiertasJ = new Set(din ? [din.rondas[0].id] : []);
const estrellas = (n) => "⭐".repeat(n) + "☆".repeat(Math.max(0, 3 - n));

function pintarJugar() {
  if (!din) { $("jugar").innerHTML = '<p class="gris">Todavía no hay una dinámica cargada.</p>'; return; }
  const esHoy = din.fecha === HOY;
  let h = '<div class="ro-niveles">' + R.DINAMICAS.map((d) => '<button class="btn" data-g="' + R.esc(d.id) + '" aria-pressed="' + (d.id === din.id) + '">' + d.ic + "<br><small>" + R.esc(d.titulo.replace(/^La misión de Roli: /, "Misión: ")) + "</small></button>").join("") + "</div>"
    + '<h2 style="margin:.4rem 0">' + din.ic + " " + R.esc(din.titulo) + (esHoy ? '<span class="ro-hoy">HOY</span>' : '<span class="gris" style="font-size:.8rem;font-weight:400"> · ' + R.esc(din.fecha) + "</span>") + "</h2>"
    + '<p class="gris" style="margin:.2rem 0">' + R.esc(din.meta) + " · " + R.esc(din.minutos) + " minutos.</p>"
    + '<p style="margin:.4rem 0">' + R.esc(din.como) + "</p>"
    + '<div class="tarj ro-hoja"><div class="ro-grupo" style="margin-top:0">👥 El equipo</div><p class="gris" style="margin:.2rem 0">Pongan los nombres. En cada ronda la página dice quién hace cada rol, y rotan solos.</p>'
    + '<div class="ro-med">' + juego.jugadores.map((j, i) => '<label>Persona ' + (i + 1) + '<input type="text" maxlength="20" data-nom="' + i + '" value="' + R.esc(j) + '"></label>').join("") + "</div>"
    + '<div class="fila-btn"><button class="mini" id="jMas">＋ Sumar a alguien</button><button class="mini" id="jMenos"' + (juego.jugadores.length <= 2 ? " hidden" : "") + '>− Quitar al último</button></div></div>'
    + '<ul class="ro-cosas">' + din.cosas.map((c) => "<li>" + R.esc(c) + "</li>").join("") + "</ul>";
  din.rondas.forEach((r, ri) => {
    const hs = r.pasos.filter((_, i) => juego.hechos[r.id + ":" + i]).length, e = juego.est[r.id] || {}, est = R.estrellasPorIntentos(e.intentos, !!e.logrado);
    const reparto = R.asignarRoles(juego.jugadores, r.roles, ri), por = {}; reparto.forEach((x) => { (por[x.rol] ||= []).push(x.persona); });
    h += '<details class="ro-act" data-r="' + r.id + '"' + (abiertasJ.has(r.id) ? " open" : "") + '><summary><span class="ic">' + r.ic + '</span><span class="n">Ronda ' + (ri + 1) + " · " + R.esc(r.titulo)
      + "<small>" + R.esc(r.logro) + '</small></span><span class="cta' + (est ? " ok" : "") + '">' + (est ? estrellas(est) : hs + "/" + r.pasos.length) + "</span></summary><div class=\"ro-cuerpo\">";
    if (r.ojos) h += '<p class="ro-aviso">' + R.esc(R.AVISO_OJOS) + "</p>";
    h += '<p class="gris" style="margin:.2rem 0">⏱ ' + r.minutos + " min · Nivel " + r.nivel + "</p><p>" + R.esc(r.que) + "</p>"
      + '<div class="ro-des" style="margin:.4rem 0">' + r.roles.map((ro) => ro.ic + " <b>" + R.esc((por[ro.id] || ["¿?"]).join(" y ")) + "</b> — " + R.esc(ro.nombre) + ": " + R.esc(ro.hace)).join("<br>")
      + (() => { const ayudan = juego.jugadores.filter((j) => j.trim() && !reparto.some((x) => x.persona === j)); return ayudan.length ? "<br>👀 <b>" + R.esc(ayudan.join(" y ")) + "</b> — Ayuda: cuenta los segundos, anota los intentos y avisa si algo se sale de la cinta." : ""; })() + "</div>";
    r.pasos.forEach((p, i) => {
      const ok = juego.hechos[r.id + ":" + i];
      h += '<div class="ro-paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-jp="' + r.id + ":" + i + '"' + (ok ? " checked" : "") + ' aria-label="Hecho"><div class="t"><b>' + (i + 1) + ". " + R.esc(p.t) + "</b><br>"
        + (p.escribi || []).map((c) => "<code>" + R.esc(c) + "</code>").join("") + (p.ve ? '<p class="ro-ve">👉 ' + R.esc(p.ve) + "</p>" : "") + "</div></div>";
    });
    if (r.entrena) h += '<div class="ro-des">📏 <b>Entrenamiento:</b> ' + R.esc(r.entrena) + "</div>";
    h += '<div class="ro-pts"><label>Intentos hasta lograrlo <input type="number" inputmode="numeric" min="1" max="20" data-int="' + r.id + '" value="' + R.esc(String(e.intentos ?? "")) + '"></label>'
      + '<label><input type="checkbox" data-logro="' + r.id + '"' + (e.logrado ? " checked" : "") + '> ¡Lo logramos!</label><b>' + (est ? estrellas(est) : "") + "</b></div></div></details>";
  });
  const tot = R.totalEstrellas(juego.est, din.rondas);
  h += '<div class="tarj"><div class="ro-grupo" style="margin-top:0">⭐ Las estrellas del equipo</div><div class="ro-total"><b>' + tot.total + "</b> ⭐ · meta del equipo: " + din.metaEstrellas + " (máximo " + tot.max + " sin el bonus)</div><p>" + R.esc(R.mensajeDeEquipo(tot.total, tot.max, din.metaEstrellas)) + "</p></div>";
  const m = juego.medidas;
  h += '<div class="tarj"><div class="ro-grupo" style="margin-top:0">📏 Las medidas de hoy</div><p class="gris" style="margin:.2rem 0">Lo que se mide jugando sirve para ajustar a Roli. Se las pasan a Mauro con el botón de abajo.</p>'
    + '<div class="ro-med"><label>Velocidad usada<input type="number" inputmode="numeric" data-med="velocidad" value="' + R.esc(String(m.velocidad ?? "")) + '"></label>'
    + '<label>Segundos para 1 metro<input type="number" inputmode="decimal" step="0.1" data-med="segundosPorMetro" value="' + R.esc(String(m.segundosPorMetro ?? "")) + '"></label>'
    + '<label>Segundos de «izquierda» para 90°<input type="number" inputmode="decimal" step="0.1" data-med="giro90" value="' + R.esc(String(m.giro90 ?? "")) + '"></label>'
    + '<label>Algo más que notaron<input type="text" maxlength="300" data-med="nota" value="' + R.esc(String(m.nota ?? "")) + '"></label></div>'
    + '<div class="fila-btn"><button class="btn p" id="jCopiar">📋 Copiar las medidas para Mauro</button></div><pre id="jTexto" class="gris" style="white-space:pre-wrap;font-size:.85rem"></pre></div>'
    + '<div class="tarj"><div class="ro-grupo" style="margin-top:0">🎉 Para terminar</div><ul class="ro-cosas">' + din.cierre.map((c) => "<li>" + R.esc(c) + "</li>").join("") + "</ul></div>";
  $("jugar").innerHTML = h;
}

function pintarCompras() {
  const t = R.totalCompras(R.COMPRAS, compras);
  $("total").innerHTML = "Falta comprar: <b>USD " + t.min + "–" + t.max + "</b> (aproximado)";
  $("compras").innerHTML = R.porPrioridad().map((g) => '<div class="ro-grupo">' + R.esc(R.PRIORIDAD_TEXTO[g.p]) + "</div>" + g.items.map((c) => {
    const e = compras[c.id] || "falta";
    const b = (v, n) => '<button class="btn' + (e === v ? " on" : "") + '" data-c="' + c.id + '" data-v="' + v + '">' + n + "</button>";
    return '<div class="ro-comp"><div class="t"><b>' + R.esc(c.n) + (c.opcional ? " (opcional)" : "") + '</b><span class="usd">' + R.usd(c.usd) + "</span></div>"
      + '<div class="para">' + R.esc(c.para) + "</div>" + (c.ojo ? '<div class="ojo">⚠ ' + R.esc(c.ojo) + "</div>" : "")
      + (c.pendiente ? '<div class="para">Pendiente en el panel: <code>' + c.pendiente + "</code></div>" : "")
      + '<div class="ro-tres">' + b("falta", "Falta") + b("pedido", "Pedido") + b("llego", "Llegó ✓") + "</div></div>";
  }).join("")).join("");
}

function ver(v) {
  $("vAct").hidden = v !== "act"; $("vCom").hidden = v !== "com"; $("vJug").hidden = v !== "jug";
  $("tAct").setAttribute("aria-pressed", v === "act"); $("tCom").setAttribute("aria-pressed", v === "com"); $("tJug").setAttribute("aria-pressed", v === "jug");
  if (v === "com") pintarCompras(); else if (v === "jug") pintarJugar(); else pintarActs();
}
$("tAct").onclick = () => { history.replaceState(null, "", "#"); ver("act"); };
$("tJug").onclick = () => { history.replaceState(null, "", "#jugar"); ver("jug"); };
$("jugar").addEventListener("toggle", (ev) => { const d = ev.target; if (!d.dataset || !d.dataset.r) return; if (d.open) abiertasJ.add(d.dataset.r); else abiertasJ.delete(d.dataset.r); }, true);
$("jugar").addEventListener("change", (ev) => {
  const t = ev.target, d = t.dataset;
  if (d.jp) { if (t.checked) juego.hechos[d.jp] = 1; else delete juego.hechos[d.jp]; }
  else if (d.int != null) { (juego.est[d.int] ||= {}).intentos = t.value === "" ? "" : Math.max(1, Math.min(20, +t.value)); if (t.value !== "") juego.est[d.int].logrado = true; }
  else if (d.logro != null) { (juego.est[d.logro] ||= {}).logrado = t.checked; }
  else if (d.nom != null) { const nuevo = t.value.trim(); if (nuevo && !juego.jugadores.includes(nuevo)) juego.jugadores[+d.nom] = nuevo; }
  else if (d.med) { juego.medidas[d.med] = t.value; }
  guardarJuego(); pintarJugar();
});
$("jugar").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.g) { const d = R.DINAMICAS.find((x) => x.id === b.dataset.g); if (d) { din = d; guardar("roli_juego_elegido", d.id); juego = cargarJuego(); abiertasJ.clear(); abiertasJ.add(d.rondas[0].id); pintarJugar(); } return; }
  if (b.id === "jMas" && juego.jugadores.length < 6) { juego.jugadores.push("Persona " + (juego.jugadores.length + 1)); guardarJuego(); pintarJugar(); }
  else if (b.id === "jMenos" && juego.jugadores.length > 2) { juego.jugadores.pop(); guardarJuego(); pintarJugar(); }
  else if (b.id === "jCopiar") {
    const texto = R.medidasParaMauro(juego.medidas, din.fecha); $("jTexto").textContent = texto;
    try { await navigator.clipboard.writeText(texto); b.textContent = "✔ Copiado"; } catch (e) { b.textContent = "Copialo desde acá abajo"; }
  }
});
$("tCom").onclick = () => { history.replaceState(null, "", "#comprar"); ver("com"); };
$("niveles").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-n]"); if (!b) return; nivel = +b.dataset.n; guardar("roli_nivel", nivel); pintarActs(); });
$("acts").addEventListener("toggle", (ev) => { const d = ev.target; if (!d.dataset || !d.dataset.a) return; if (d.open) abiertas.add(d.dataset.a); else abiertas.delete(d.dataset.a); }, true);
$("acts").addEventListener("change", (ev) => { const t = ev.target; if (!t.dataset.p) return; if (t.checked) hechos[t.dataset.p] = 1; else delete hechos[t.dataset.p]; guardar("roli_hechos", hechos); pintarActs(); });
$("compras").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-c]"); if (!b) return; if (b.dataset.v === "falta") delete compras[b.dataset.c]; else compras[b.dataset.c] = b.dataset.v; guardar("roli_compras", compras); pintarCompras(); });
ver(location.hash === "#comprar" ? "com" : location.hash === "#jugar" ? "jug" : "act");
</script>
</body>
</html>
